name: Deploy jager-vps.ru

on:
  push:
    branches: [main]

concurrency:
  group: deploy-jager-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/jager-vps
            git pull
            npm ci
            npm run build
            pm2 restart jager-vps
            pm2 save
